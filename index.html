<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#10151d">
  <title>一念成仙 · Cultivation Survivors</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="game-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">☯</span><div><strong>一念成仙</strong><small>CULTIVATION SURVIVORS</small></div></div>
      <div class="top-actions"><button id="pause-btn" class="mini-btn" aria-label="暂停">Ⅱ</button></div>
    </header>

    <section id="stage">
      <canvas id="game" aria-label="游戏画面"></canvas>
      <div class="hud">
        <div class="hud-left">
          <div class="stat-row"><span class="stat-icon">❤</span><div class="bar"><div id="hp-fill" class="bar-fill hp"></div></div><b id="hp-text">100 / 100</b></div>
          <div class="stat-row"><span class="stat-icon">✦</span><div class="bar"><div id="xp-fill" class="bar-fill xp"></div></div><b id="level-text">炼气一层 · Lv.1</b></div>
        </div>
        <div class="hud-right"><div id="timer">00:00</div><div id="kill-count">妖兽 0</div></div>
      </div>

      <div id="start-screen" class="overlay">
        <div class="panel title-panel">
          <div class="seal">☯</div>
          <p class="eyebrow">一念起，万法生</p>
          <h1>一念成仙</h1>
          <p class="subtitle">在妖兽潮中修炼，突破境界，求得一线仙机。</p>
          <div class="feature-pills"><span>灵剑自动追敌</span><span>随机功法</span><span>无尽妖潮</span></div>
          <button id="start-btn" class="primary-btn">踏入秘境 <span>→</span></button>
          <p class="hint">电脑：WASD / 方向键移动 · 空格施放剑气 · P 暂停</p>
          <p class="hint mobile-hint">手机：左侧摇杆移动 · 右侧按钮施放剑气</p>
        </div>
      </div>

      <div id="upgrade-screen" class="overlay hidden">
        <div class="panel upgrade-panel">
          <p class="eyebrow">灵气充盈 · 境界精进</p><h2>择一功法</h2>
          <p class="subtitle">选择一项强化，继续你的修行。</p>
          <div id="upgrade-options" class="upgrade-options"></div>
        </div>
      </div>

      <div id="pause-screen" class="overlay hidden">
        <div class="panel compact-panel"><p class="eyebrow">静心凝神</p><h2>修行暂停</h2><p class="subtitle">秘境中的时间暂时停滞。</p><button id="resume-btn" class="primary-btn">继续修行</button><button id="restart-from-pause" class="secondary-btn">重新开始</button></div>
      </div>

      <div id="gameover-screen" class="overlay hidden">
        <div class="panel compact-panel"><p class="eyebrow">尘缘未尽</p><h2>本次修行结束</h2><div class="result-grid"><div><small>存活时间</small><strong id="result-time">00:00</strong></div><div><small>斩妖数量</small><strong id="result-kills">0</strong></div><div><small>修为等级</small><strong id="result-level">1</strong></div></div><button id="restart-btn" class="primary-btn">再入秘境 <span>↻</span></button></div>
      </div>

      <div id="touch-controls" class="touch-controls">
        <div id="joystick" class="joystick"><div id="stick" class="stick"></div></div>
        <button id="skill-btn" class="skill-btn"><span>✦</span><small>剑气</small></button>
      </div>
      <div id="toast" class="toast"></div>
    </section>
    <footer><span>灵气运行 · 心法自成</span><span>原型版 0.1</span></footer>
  </main>
  <script src="js/input.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
